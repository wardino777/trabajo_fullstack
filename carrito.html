<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Vida Infinita</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2>🐾 Vida Infinita</h2>
            </div>
            <ul class="enlaces-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="carrito">
                <a href="carrito.html">🛒 Cart</a>
            </div>
            <div class="cuenta">
                <a href="login.html">Iniciar sesión</a> | 
                <a href="registro.html">Registrar usuario</a>
            </div>
        </nav>
    </header>
    <main>
        <h2>Mi carrito de compras</h2>
        <div class="contenedor-carrito">
            <div class="lista-items" id="items-carrito">
            </div>
            <div class="resumen-pago">
                <div class="caja-total">
                    <span>TOTAL:</span>
                    <span id="precio-total">$ 0</span>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 0.8em; color: gray;">Ingrese el cupón de descuento</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px;">
                        <input type="text" style="margin: 0;">
                        <button style="padding: 0 15px;">APLICAR</button>
                    </div>
                </div>
                <button id="btn-pagar" class="btn-pagar">PAGAR</button>
            </div>
        </div>
    </main>
    <footer>
        <p>
            <a href="productos.html?cat=perros" style="color: #333; text-decoration: none;">Categoría Perros</a> | 
            <a href="productos.html?cat=gatos" style="color: #333; text-decoration: none;">Categoría Gatos</a> | 
            <a href="productos.html?cat=exoticos" style="color: #333; text-decoration: none;">Categoría Exóticos</a>
        </p>
        <div>
            <label for="boletin-carrito">Suscríbete a nuestro boletín:</label>
            <input type="email" id="boletin-carrito" placeholder="Enter Email">
            <button>Suscribir</button>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
