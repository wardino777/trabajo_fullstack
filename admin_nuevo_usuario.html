<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Vida Infinita</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="body-admin">
    <div class="contenedor-admin">
        <aside class="menu-lateral">
            <div class="logo-admin">
                <h2><i class="fa-solid fa-compass"></i> Vida Infinita</h2>
            </div>
            <nav class="navegacion-admin" style="display: flex; flex-direction: column; height: 100%;">
                <ul style="list-style: none; padding: 0;">
                    <li><a href="admin_home.html"><i class="fa-solid fa-border-all" style="width: 25px;"></i> Dashboard</a></li>
                    <li><a href="admin_orders.html"><i class="fa-regular fa-file-lines" style="width: 25px;"></i> Orders</a></li>
                    <li><a href="admin_productos.html"><i class="fa-solid fa-box" style="width: 25px; color: #a57c52;"></i> Inventory</a></li>
                    <li><a href="admin_reports.html"><i class="fa-regular fa-file-lines" style="width: 25px;"></i> Reports</a></li>
                    <li><a href="admin_usuarios.html" class="activo"><i class="fa-solid fa-users" style="width: 25px;"></i> Employees</a></li>
                    <li><a href="admin_clientes.html"><i class="fa-solid fa-users" style="width: 25px;"></i> Customers</a></li>
                </ul>
                <ul style="list-style: none; padding: 0; margin-top: auto; margin-bottom: 20px;">
                    <li><a href="admin_settings.html" style="display: block; padding: 10px 25px; color: #333; text-decoration: none; font-size: 0.9em;"><i class="fa-solid fa-gear" style="width: 20px;"></i> Settings</a></li>
                    <li><a href="admin_profile.html" style="display: block; padding: 10px 25px; color: #333; text-decoration: none; font-size: 0.9em;"><i class="fa-solid fa-user" style="width: 20px;"></i> Profile</a></li>
                    <li><a href="#" class="btn-buscar-global" style="display: block; padding: 10px 25px; color: #333; text-decoration: none; font-size: 0.9em;"><i class="fa-solid fa-magnifying-glass" style="width: 20px;"></i> Search</a></li>
                    <li><a href="#" style="display: block; padding: 10px 25px; color: #333; text-decoration: none; font-size: 0.9em;"><i class="fa-solid fa-question" style="width: 20px; color: red;"></i> Help</a></li>
                    <li><a href="index.html" style="display: block; padding: 10px 25px; color: #d9534f; text-decoration: none; font-size: 0.9em; font-weight: bold;"><i class="fa-solid fa-arrow-right-from-bracket" style="width: 20px;"></i> Cerrar Sesión</a></li>
                </ul>
                <div style="padding: 20px; border-top: 1px solid #dcdcdc; display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-user" style="font-size: 1.5em; color: #555;"></i> <b>Profile</b>
                </div>
            </nav>
        </aside>
        <main class="contenido-central">
            <header class="header-admin">
                <div class="header-izq">
                    <h1>NUEVO EMPLEADO</h1>
                </div>
                <div class="notificacion"><i class="fa-solid fa-bell" style="color: #f1c40f; font-size: 1.5em;"></i></div>
            </header>
            <section class="panel-formulario">
                <div class="seccion-registro" style="max-width: 800px; margin: 0; border: 1px solid #dcdcdc;">
                    <h2 style="background-color: #d6d6d6; color: black;">Registro de usuario</h2>
                    <form id="form-nuevo-usuario">
                        <div>
                            <label for="nombre-usuario">NOMBRE COMPLETO</label>
                            <input type="text" id="nombre-usuario" name="nombre-usuario" maxlength="50" required>
                        </div>
                        <div>
                            <label for="apellidos-usuario">APELLIDOS</label>
                            <input type="text" id="apellidos-usuario" name="apellidos-usuario" maxlength="100" required>
                        </div>
                        <div>
                            <label for="run">RUN (Sin puntos ni guion)</label>
                            <input type="text" id="run" name="run" minlength="7" maxlength="9" required>
                        </div>
                        <div>
                            <label for="correo-usuario">CORREO</label>
                            <input type="email" id="correo-usuario" name="correo-usuario" maxlength="100" required>
                        </div>
                        <div>
                            <label for="tipo-usuario">TIPO DE USUARIO</label>
                            <select id="tipo-usuario" name="tipo-usuario" required>
                                <option value="">- Seleccione perfil -</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Vendedor">Vendedor</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 20px;">
                            <div style="flex: 1;">
                                <label for="region-select">REGIÓN</label>
                                <select id="region-select" name="region-select" required>
                                    <option value="">- Seleccione -</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label for="comuna-select">COMUNA</label>
                                <select id="comuna-select" name="comuna-select" required>
                                    <option value="">- Seleccione Región primero -</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="direccion">DIRECCIÓN</label>
                            <input type="text" id="direccion" name="direccion" maxlength="300" required>
                        </div>
                        <button type="submit" style="width: 200px; margin-top: 20px;" class="btn-negro">REGISTRAR</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
