<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Vida Infinita</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2>🐾 Vida Infinita</h2>
            </div>
            <ul class="enlaces-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="carrito">
                <a href="carrito.html">🛒 Cart</a>
            </div>
            <div class="cuenta">
                <a href="login.html">Iniciar sesión</a> | 
                <a href="registro.html">Registrar usuario</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-login">
            <div class="centro-login">
                <img src="https://placehold.co/150x150?text=Logo" alt="Logo de Vida Infinita">
                <h2>Vida Infinita</h2>
            </div>
            <div class="caja-formulario">
                <h3>Inicio de sesión</h3>
                <form id="form-login">
                    <div>
                        <label for="login-correo">CORREO</label><br>
                        <input type="email" id="login-correo" name="login-correo" required>
                    </div>
                    <br>
                    <div>
                        <label for="login-contrasena">CONTRASEÑA</label><br>
                        <input type="password" id="login-contrasena" name="login-contrasena" required>
                    </div>
                    <br>
                    <button type="submit" id="btn-login">Iniciar sesión</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <p>
            <a href="productos.html?cat=perros" style="color: #333; text-decoration: none;">Categoría Perros</a> | 
            <a href="productos.html?cat=gatos" style="color: #333; text-decoration: none;">Categoría Gatos</a> | 
            <a href="productos.html?cat=exoticos" style="color: #333; text-decoration: none;">Categoría Exóticos</a>
        </p>
        <div>
            <label for="boletin-login">Suscríbete a nuestro boletín:</label>
            <input type="email" id="boletin-login" placeholder="Enter Email">
            <button>Suscribir</button>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
