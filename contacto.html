<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Vida Infinita</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2>🐾 Vida Infinita</h2>
            </div>
            <ul class="enlaces-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="carrito">
                <a href="carrito.html">🛒 Cart</a>
            </div>
            <div class="cuenta">
                <a href="login.html">Iniciar sesión</a> | 
                <a href="registro.html">Registrar usuario</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="centro-contacto">
            <img src="https://placehold.co/150x150?text=Logo" alt="Logo">
            <h2>Vida Infinita</h2>
        </section>
        <section class="caja-formulario">
            <h3>FORMULARIO DE CONTACTOS</h3>
            <form id="form-contacto">
                <div>
                    <label for="nombre-contacto">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre-contacto" name="nombre-contacto" maxlength="100" required>
                </div>
                <div>
                    <label for="correo-contacto">CORREO</label>
                    <input type="email" id="correo-contacto" name="correo-contacto" maxlength="100" required>
                </div>
                <div>
                    <label for="comentario">CONTENIDO</label>
                    <textarea id="comentario" name="comentario" rows="5" maxlength="500" required></textarea>
                </div>
                <button type="submit">ENVIAR MENSAJE</button>
            </form>
        </section>
    </main>
    <footer>
        <p>
            <a href="productos.html?cat=perros" style="color: #333; text-decoration: none;">Categoría Perros</a> | 
            <a href="productos.html?cat=gatos" style="color: #333; text-decoration: none;">Categoría Gatos</a> | 
            <a href="productos.html?cat=exoticos" style="color: #333; text-decoration: none;">Categoría Exóticos</a>
        </p>
        <div>
            <label for="boletin-contacto">Suscríbete a nuestro boletín:</label>
            <input type="email" id="boletin-contacto" placeholder="Enter Email">
            <button>Suscribir</button>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
