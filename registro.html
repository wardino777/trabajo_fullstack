<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vida Infinita</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h2>🐾 Vida Infinita</h2>
            </div>
            <ul class="enlaces-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="carrito">
                <a href="carrito.html">🛒 Cart</a>
            </div>
            <div class="cuenta">
                <a href="login.html">Iniciar sesión</a> | 
                <a href="registro.html">Registrar usuario</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-registro">
            <h2>Registro de usuario</h2>
            <form id="form-registro">
                <div>
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div>
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div>
                    <label for="contrasena">CONTRASEÑA</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                </div>
                <div>
                    <label for="confirmar-contrasena">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" required>
                </div>
                <div>
                    <label for="telefono">TELEFONO (opcional)</label>
                    <input type="text" id="telefono" name="telefono">
                </div>
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <select id="region-select" name="region-select" required>
                            <option value="">-- Seleccione la región --</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <select id="comuna-select" name="comuna-select" required>
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                    </div>
                </div>
                <button type="submit">REGISTRAR</button>
            </form>
        </section>
    </main>
    <footer>
        <p>
            <a href="productos.html?cat=perros" style="color: #333; text-decoration: none;">Categoría Perros</a> | 
            <a href="productos.html?cat=gatos" style="color: #333; text-decoration: none;">Categoría Gatos</a> | 
            <a href="productos.html?cat=exoticos" style="color: #333; text-decoration: none;">Categoría Exóticos</a>
        </p>
        <div>
            <label for="boletin-registro">Suscríbete a nuestro boletín:</label>
            <input type="email" id="boletin-registro" placeholder="Enter Email">
            <button>Suscribir</button>
        </div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
